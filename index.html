<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Testing - Bisapay Deposit</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #loading {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #e67e22;
            display: none;
        }
        #result {
            margin-top: 20px;
            display: none;
            text-align: center;
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }
        .qr-box {
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }
        #qr-image {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .detail-text {
            font-size: 15px;
            margin: 5px 0;
        }
        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            text-align: left;
            overflow-x: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tester Supabase Edge</h2>
    
    <label for="amount">Nominal Deposit (Rp):</label>
    <input type="number" id="amount" value="5000" min="1000" step="1000">
    
    <button id="btnSubmit" onclick="testDeposit()">Generate QR Code</button>
    
    <div id="loading">⏳ Memproses ke Supabase... Mohon tunggu.</div>
    <div id="errorBox" class="error"></div>

    <div id="result">
        <h3 style="color: #27ae60; margin-top:0;">Berhasil!</h3>
        <p class="detail-text"><strong>ID:</strong> <span id="depoId"></span></p>
        <p class="detail-text"><strong>Total Bayar:</strong> Rp <span id="depoTotal"></span></p>
        
        <div class="qr-box">
            <img id="qr-image" src="" alt="QR Code akan tampil di sini">
        </div>

        <div style="text-align: left; margin-top: 10px;">
            <label>Raw JSON Response (Buat Debug):</label>
            <pre id="rawResponse"></pre>
        </div>
    </div>
</div>

<script>
    const EDGE_FUNCTION_URL = "https://bdehqzvzmtpvamcbyfmx.supabase.co/functions/v1/bayar";

    async function testDeposit() {
        const btn = document.getElementById('btnSubmit');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const errorBox = document.getElementById('errorBox');
        const amountInput = document.getElementById('amount').value;

        // Reset UI State
        btn.disabled = true;
        loading.style.display = 'block';
        resultDiv.style.display = 'none';
        errorBox.style.display = 'none';

        try {
            const response = await fetch(EDGE_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ amount: parseInt(amountInput) })
            });

            // Baca text response dulu untuk jaga-jaga kalau error bukan JSON
            const textData = await response.text();
            let data;
            
            try {
                data = JSON.parse(textData);
            } catch (e) {
                throw new Error("Respons bukan JSON: " + textData.substring(0, 100));
            }

            if (data.success) {
                document.getElementById('depoId').innerText = data.deposit_id;
                document.getElementById('depoTotal').innerText = data.total;
                
                // Set sumber gambar QR Code
                const qrImg = document.getElementById('qr-image');
                qrImg.src = data.qr_image;
                
                // Tampilkan raw JSON buat debug
                document.getElementById('rawResponse').innerText = JSON.stringify(data, null, 2);
                
                resultDiv.style.display = 'block';
            } else {
                throw new Error(data.error || data.message || JSON.stringify(data));
            }
        } catch (error) {
            errorBox.innerText = "❌ Gagal: " + error.message;
            errorBox.style.display = 'block';
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
