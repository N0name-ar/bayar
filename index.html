<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit QRIS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #6a3de8;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
        #qr {
            margin-top: 20px;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            display: none;
        }
        #qr img {
            max-width: 100%;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
        #receipt {
            margin-top: 10px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            display: none;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            background: #f0f0f0;
            color: #333;
        }
        .btn-group .batal {
            background: #ffebee;
            color: #b71c1c;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            display: none;
            z-index: 999;
        }
        .toast.success { background: #43a047; }
        .toast.error { background: #e53935; }
        .toast.info { background: #6a3de8; }
        .fee {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h1>💳 Deposit QRIS</h1>
<p>Scan & bayar, saldo langsung masuk</p>

<input type="number" id="amount" value="1000" min="1000">
<div class="fee">💰 Biaya layanan: Rp 76</div>

<button id="btnBayar" onclick="buatDeposit()">💰 Buat Deposit</button>

<div class="btn-group">
    <button onclick="cekStatus()">🔄 Cek Status</button>
    <button class="batal" onclick="cancelDeposit()">❌ Batal</button>
</div>

<div id="qr">
    <div id="qrImage"></div>
    <div id="info">
        <p>ID Deposit: <b id="depositId">-</b></p>
        <p>Total: <b id="totalDisplay">-</b></p>
        <p id="statusBadge" style="color:#e65100;">⏳ Menunggu Pembayaran</p>
        <p id="countdown" style="font-size:14px;color:#e65100;">⏱️ Sisa waktu: 59:59</p>
    </div>
    <div id="receipt"></div>
</div>

<div id="history" style="margin-top:20px;border-top:1px solid #eee;padding-top:16px;">
    <h4>📋 Riwayat</h4>
    <div id="historyList"><span style="color:#999;">Belum ada deposit</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://bdehqzvzmtpvamcbyfmx.supabase.co/functions/v1/deposit';
let depositId = null;
let polling = null;
let countdownInterval = null;
let seconds = 3600;
let history = [];

function loadHistory() {
    try {
        const saved = localStorage.getItem('deposit_history');
        if (saved) history = JSON.parse(saved);
        renderHistory();
    } catch {}
}

function saveHistory() {
    localStorage.setItem('deposit_history', JSON.stringify(history));
}

function renderHistory() {
    const el = document.getElementById('historyList');
    if (history.length === 0) {
        el.innerHTML = '<span style="color:#999;">Belum ada deposit</span>';
        return;
    }
    el.innerHTML = history.slice(-5).reverse().map(h => `
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f5f5;">
            <span>#${h.id} - Rp ${h.total.toLocaleString()}</span>
            <span style="color:${h.status === 'success' ? '#1b5e20' : h.status === 'expired' ? '#b71c1c' : '#e65100'}">
                ${h.status === 'success' ? '✅ Sukses' : h.status === 'expired' ? '⏰ Expired' : '⏳ Pending'}
            </span>
        </div>
    `).join('');
}

function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function startCountdown() {
    seconds = 3600;
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        seconds--;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        document.getElementById('countdown').textContent = `⏱️ Sisa waktu: ${m}:${s}`;
        if (seconds <= 0) {
            clearInterval(countdownInterval);
            document.getElementById('countdown').textContent = '⏰ Waktu habis!';
            document.getElementById('statusBadge').textContent = '⏰ QR Expired!';
            document.getElementById('statusBadge').style.color = '#b71c1c';
        }
    }, 1000);
}

function showReceipt(data) {
    document.getElementById('receipt').style.display = 'block';
    document.getElementById('receipt').innerHTML = `
        <div style="font-weight:bold;color:#1b5e20;text-align:center;">✅ PEMBAYARAN BERHASIL!</div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><b>ID Deposit:</b> #${data.deposit_id}</div>
        <div style="display:flex;justify-content:space-between;padding:2px 0;"><b>Nominal:</b> ${data.amount_str || 'Rp ' + data.amount?.toLocaleString()}</div>
    `;
}

async function cekStatusInternal() {
    if (!depositId) return;
    try {
        const res = await fetch(`${API}?check=${depositId}`);
        const data = await res.json();
        console.log('Status:', data);
        
        if (data.status === 'success') {
            document.getElementById('statusBadge').textContent = '✅ Pembayaran Berhasil!';
            document.getElementById('statusBadge').style.color = '#1b5e20';
            showReceipt(data);
            clearInterval(polling);
            clearInterval(countdownInterval);
            const h = history.find(h => h.id === depositId);
            if (h) { h.status = 'success'; saveHistory(); renderHistory(); }
            showToast('🎉 Pembayaran BERHASIL!', 'success');
            setTimeout(() => {
                document.getElementById('qr').style.display = 'none';
                depositId = null;
            }, 5000);
        } else if (data.status === 'expired') {
            document.getElementById('statusBadge').textContent = '⏰ QR Expired!';
            document.getElementById('statusBadge').style.color = '#b71c1c';
            clearInterval(polling);
            clearInterval(countdownInterval);
        }
    } catch (e) { console.log(e); }
}

async function buatDeposit() {
    const btn = document.getElementById('btnBayar');
    const amount = parseInt(document.getElementById('amount').value) || 1000;
    if (amount < 1000) { showToast('Minimal Rp 1.000', 'error'); return; }
    
    btn.disabled = true;
    btn.innerHTML = '⏳ Memproses...';
    document.getElementById('qr').style.display = 'none';
    document.getElementById('receipt').style.display = 'none';
    clearInterval(polling);
    clearInterval(countdownInterval);
    
    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount })
        });
        const data = await res.json();
        console.log('Response:', data);
        
        if (!data.success) throw new Error(data.error || 'Gagal');
        
        depositId = data.deposit_id;
        
        history.push({ id: data.deposit_id, total: data.total, status: 'pending' });
        saveHistory();
        renderHistory();
        
        document.getElementById('qr').style.display = 'block';
        document.getElementById('qrImage').innerHTML = `<img src="${data.qr_image}" alt="QRIS" onerror="this.innerHTML='QR Error'">`;
        document.getElementById('depositId').textContent = data.deposit_id;
        document.getElementById('totalDisplay').textContent = `Rp ${data.total.toLocaleString()}`;
        document.getElementById('statusBadge').textContent = '⏳ Menunggu Pembayaran';
        document.getElementById('statusBadge').style.color = '#e65100';
        
        startCountdown();
        polling = setInterval(cekStatusInternal, 8000);
        showToast(`✅ Deposit #${data.deposit_id} berhasil!`, 'success');
        
    } catch (e) {
        showToast(`❌ ${e.message}`, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '💰 Buat Deposit';
    }
}

async function cekStatus() {
    if (!depositId) { showToast('Belum ada deposit', 'error'); return; }
    showToast('⏳ Mengecek...', 'info');
    await cekStatusInternal();
}

async function cancelDeposit() {
    if (!depositId) { showToast('Belum ada deposit', 'error'); return; }
    if (!confirm(`Batalkan deposit #${depositId}?`)) return;
    showToast('⏳ Membatalkan...', 'info');
    try {
        const res = await fetch(`${API}?cancel=${depositId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            showToast(`✅ ${data.message}`, 'success');
            const h = history.find(h => h.id === depositId);
            if (h) { h.status = 'expired'; saveHistory(); renderHistory(); }
            clearInterval(polling);
            clearInterval(countdownInterval);
            document.getElementById('qr').style.display = 'none';
            depositId = null;
        } else {
            showToast(`❌ ${data.error || 'Gagal'}`, 'error');
        }
    } catch (e) {
        showToast(`❌ ${e.message}`, 'error');
    }
}

loadHistory();
</script>
</body>
</html>
