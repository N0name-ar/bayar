<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit QRIS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }
        input:focus { border-color: #6a3de8; outline: none; }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #6a3de8;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            background: #f0f0f0;
            color: #333;
        }
        .btn-group .batal { background: #ffebee; color: #b71c1c; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            display: none;
            z-index: 999;
        }
        .toast.success { background: #43a047; }
        .toast.error { background: #e53935; }
        .toast.info { background: #6a3de8; }
        .fee { font-size: 12px; color: #999; margin-bottom: 10px; }
        .pending-text { color: #e65100; }
        .success-text { color: #1b5e20; }
        .expired-text { color: #b71c1c; }
        #statusBadge { font-weight: bold; margin-top: 16px; }
        .history {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 16px;
            text-align: left;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        #qr {
            margin-top: 20px;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            display: none;
        }
        #qr.show { display: block; }
        #qr img {
            max-width: 250px;
            background: white;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        #receipt {
            display: none;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-top: 10px;
        }
        #receipt.show { display: block; }
        #debug {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #666;
            margin-top: 12px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            display: none;
            font-family: monospace;
        }
        #debug.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>💳 Deposit QRIS</h1>
    <p style="color:#666;font-size:14px;">Scan & bayar, saldo langsung masuk</p>

    <input type="number" id="amount" value="1000" min="1000">
    <div class="fee">💰 Biaya layanan: Rp 76</div>

    <button id="btnBayar" onclick="buatDeposit()">💰 Buat Deposit</button>

    <div class="btn-group">
        <button onclick="cekStatus()">🔄 Cek Status</button>
        <button class="batal" onclick="cancelDeposit()">❌ Batal</button>
    </div>

    <div id="statusBadge" class="pending-text">⏳ Menunggu Pembayaran</div>

    <div id="qr">
        <div id="qrImage"></div>
        <p>ID Deposit: <b id="depositId">-</b></p>
        <p>Total: <b id="totalDisplay">-</b></p>
        <p id="countdown" style="font-size:14px;color:#e65100;">⏱️ Sisa waktu: 59:59</p>
    </div>

    <div id="receipt"></div>

    <div class="history">
        <h4>📋 Riwayat</h4>
        <div id="historyList"><span style="color:#999;">Belum ada deposit</span></div>
    </div>

    <div id="debug"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://bdehqzvzmtpvamcbyfmx.supabase.co/functions/v1/deposit';
let depositId = null;
let polling = null;
let countdownInterval = null;
let seconds = 3600;
let history = [];

function debug(msg) {
    const el = document.getElementById('debug');
    el.classList.add('show');
    el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    el.scrollTop = el.scrollHeight;
    console.log(msg);
}

function loadHistory() {
    try {
        const saved = localStorage.getItem('deposit_history');
        if (saved) history = JSON.parse(saved);
        renderHistory();
    } catch {}
}

function saveHistory() {
    localStorage.setItem('deposit_history', JSON.stringify(history));
}

function renderHistory() {
    const el = document.getElementById('historyList');
    if (history.length === 0) {
        el.innerHTML = '<span style="color:#999;">Belum ada deposit</span>';
        return;
    }
    el.innerHTML = history.slice(-5).reverse().map(h => `
        <div class="history-item">
            <span>#${h.id} - Rp ${h.total.toLocaleString()}</span>
            <span style="color:${h.status === 'success' ? '#1b5e20' : h.status === 'expired' ? '#b71c1c' : '#e65100'}">
                ${h.status === 'success' ? '✅ Sukses' : h.status === 'expired' ? '⏰ Expired' : '⏳ Pending'}
            </span>
        </div>
    `).join('');
}

function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function startCountdown() {
    seconds = 3600;
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        seconds--;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        document.getElementById('countdown').textContent = `⏱️ Sisa waktu: ${m}:${s}`;
        if (seconds <= 0) {
            clearInterval(countdownInterval);
            document.getElementById('countdown').textContent = '⏰ Waktu habis!';
            document.getElementById('statusBadge').textContent = '⏰ QR Expired!';
            document.getElementById('statusBadge').className = 'expired-text';
        }
    }, 1000);
}

function showReceipt(data) {
    const el = document.getElementById('receipt');
    el.classList.add('show');
    el.innerHTML = `
        <div style="font-weight:bold;color:#1b5e20;text-align:center;">✅ PEMBAYARAN BERHASIL!</div>
        <div><b>ID Deposit:</b> #${data.deposit_id}</div>
        <div><b>Nominal:</b> ${data.amount_str || 'Rp ' + data.amount?.toLocaleString()}</div>
    `;
}

async function cekStatusInternal() {
    if (!depositId) return;
    try {
        debug('Cek status #' + depositId);
        const res = await fetch(`${API}?check=${depositId}`);
        const data = await res.json();
        debug('Status: ' + JSON.stringify(data));
        
        if (data.status === 'success') {
            document.getElementById('statusBadge').textContent = '✅ Pembayaran Berhasil!';
            document.getElementById('statusBadge').className = 'success-text';
            showReceipt(data);
            clearInterval(polling);
            clearInterval(countdownInterval);
            const h = history.find(h => h.id === depositId);
            if (h) { h.status = 'success'; saveHistory(); renderHistory(); }
            showToast('🎉 Pembayaran BERHASIL!', 'success');
            setTimeout(() => {
                document.getElementById('qr').classList.remove('show');
                depositId = null;
            }, 5000);
        } else if (data.status === 'expired') {
            document.getElementById('statusBadge').textContent = '⏰ QR Expired!';
            document.getElementById('statusBadge').className = 'expired-text';
            clearInterval(polling);
            clearInterval(countdownInterval);
        }
    } catch (e) { 
        debug('Error cek status: ' + e.message);
    }
}

async function buatDeposit() {
    const btn = document.getElementById('btnBayar');
    const amount = parseInt(document.getElementById('amount').value) || 1000;
    if (amount < 1000) { showToast('Minimal Rp 1.000', 'error'); return; }
    
    btn.disabled = true;
    btn.innerHTML = '⏳ Memproses...';
    document.getElementById('qr').classList.remove('show');
    document.getElementById('receipt').classList.remove('show');
    document.getElementById('debug').innerHTML = '';
    document.getElementById('debug').classList.remove('show');
    clearInterval(polling);
    clearInterval(countdownInterval);
    
    try {
        debug('Buat deposit: ' + amount);
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount })
        });
        const data = await res.json();
        debug('Response: ' + JSON.stringify(data));
        
        if (!data.success) throw new Error(data.error || 'Gagal');
        if (!data.qr_image) throw new Error('QR tidak tersedia');
        
        depositId = data.deposit_id;
        
        history.push({ id: data.deposit_id, total: data.total, status: 'pending' });
        saveHistory();
        renderHistory();
        
        document.getElementById('qr').classList.add('show');
        document.getElementById('qrImage').innerHTML = `<img src="${data.qr_image}" alt="QRIS">`;
        document.getElementById('depositId').textContent = data.deposit_id;
        document.getElementById('totalDisplay').textContent = `Rp ${data.total.toLocaleString()}`;
        document.getElementById('statusBadge').textContent = '⏳ Menunggu Pembayaran';
        document.getElementById('statusBadge').className = 'pending-text';
        
        startCountdown();
        polling = setInterval(cekStatusInternal, 8000);
        showToast(`✅ Deposit #${data.deposit_id} berhasil!`, 'success');
        
    } catch (e) {
        debug('❌ ERROR: ' + e.message);
        showToast(`❌ ${e.message}`, 'error');
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '💰 Buat Deposit';
    }
}

async function cekStatus() {
    if (!depositId) { showToast('Belum ada deposit', 'error'); return; }
    showToast('⏳ Mengecek...', 'info');
    await cekStatusInternal();
}

async function cancelDeposit() {
    if (!depositId) { showToast('Belum ada deposit', 'error'); return; }
    if (!confirm(`Batalkan deposit #${depositId}?`)) return;
    showToast('⏳ Membatalkan...', 'info');
    try {
        const res = await fetch(`${API}?cancel=${depositId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            showToast(`✅ ${data.message}`, 'success');
            const h = history.find(h => h.id === depositId);
            if (h) { h.status = 'expired'; saveHistory(); renderHistory(); }
            clearInterval(polling);
            clearInterval(countdownInterval);
            document.getElementById('qr').classList.remove('show');
            depositId = null;
        } else {
            showToast(`❌ ${data.error || 'Gagal'}`, 'error');
        }
    } catch (e) {
        showToast(`❌ ${e.message}`, 'error');
    }
}

loadHistory();
</script>
</body>
</html>
